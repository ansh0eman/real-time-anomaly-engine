
services:
  postgres:
    image: postgres:15
    container_name: outlier_engine_postgres
    environment:
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_password
      POSTGRES_DB: outlier_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d outlier_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: outlier_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web_api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: outlier_engine_api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://engine_user:engine_password@postgres:5432/outlier_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stream_worker:
    build: .
    command: python worker.py
    container_name: outlier_engine_worker
    environment:
      POSTGRES_URL: postgresql://engine_user:engine_password@postgres:5432/outlier_db
      REDIS_URL: redis://redis:6379/0
      API_URL: http://web_api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
